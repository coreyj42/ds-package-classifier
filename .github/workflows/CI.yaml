name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Test, Lint, and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.12

      - name: Install poetry
        run: pipx install poetry==1.8.4

      - name: Run Make commands
        run: make all

      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code --quiet || (echo "::error::Code is not formatted properly. Please run 'make format' and commit the changes." && exit 1)